name: tk-fare-watch

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada (GitHub cron "en iyi caba"; ara sira sarkabilir)
  workflow_dispatch:          # Actions sekmesinden manuel calistirma
    inputs:
      report:
        description: "Mevcut tum biletlerin tam listesini hemen Telegram'a gonder"
        type: boolean
        default: true

permissions:
  contents: write             # state.json'u repoya geri commit'lemek icin

concurrency:                  # ust uste binen calismalari sirala (yaris/cift bildirim onler)
  group: fare-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Izleyiciyi calistir
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fare_watch.py ${{ github.event.inputs.report == 'true' && '--report' || '' }}

      - name: Durumu kaydet (state.json)
        run: |
          git config user.name  "fare-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json
          # Sadece gercek veri (state.json) degistiyse commit'le; latest.json'daki
          # zaman damgasi her calismada degisir, tek basina commit spam'i yapmasin.
          if git diff --cached --quiet -- state.json; then
            echo "Veri degismedi, commit yok."
          else
            git commit -m "state update [skip ci]"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push basarisiz, pull --rebase deneniyor ($i/3)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            done
            echo "UYARI: push basarisiz oldu." && exit 1
          fi
