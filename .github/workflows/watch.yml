name: tk-fare-watch

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada (GitHub cron "en iyi caba"; ara sira sarkabilir)
  workflow_dispatch:          # Actions sekmesinden manuel calistirma
    inputs:
      report:
        description: "Mevcut tum biletlerin tam listesini hemen Telegram'a gonder"
        type: boolean
        default: true
      check:
        description: "Sadece musteri tablosu kurulumunu dogrula (tarama yapma)"
        type: boolean
        default: false
      mark:
        description: "Satin alma sonucunu tabloya yaz: satir|YYYYAAGG|1"
        type: string
        default: ""

permissions:
  contents: write             # state.json'u repoya geri commit'lemek icin

concurrency:                  # ust uste binen calismalari sirala (yaris/cift bildirim onler)
  group: fare-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Izleyiciyi calistir
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_SECRET:   ${{ secrets.WEBHOOK_SECRET }}
          # Musteri eslestirme (opsiyonel — yoksa sistem normal calisir)
          CUSTOMERS_SHEET_ID: ${{ secrets.CUSTOMERS_SHEET_ID }}
          GOOGLE_SA_JSON:     ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.mark }}" ]; then
            python fare_watch.py --mark "${{ github.event.inputs.mark }}"
          elif [ "${{ github.event.inputs.check }}" = "true" ]; then
            python fare_watch.py --check-customers
          else
            python fare_watch.py ${{ github.event.inputs.report == 'true' && '--report' || '' }}
          fi

      - name: Durumu kaydet (state.json)
        run: |
          git config user.name  "fare-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json
          # state.json VEYA latest.json degistiyse yayinla. latest.json'in zaman damgasi
          # artik sadece icerik degisince yenilenir (write_latest), bu yuzden commit spam'i olmaz;
          # buna karsilik tukenen bilet / koltuk degisimi ANINDA yayinlanir.
          if git diff --cached --quiet -- state.json latest.json; then
            echo "Veri degismedi, commit yok."
          else
            git commit -m "state update [skip ci]"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push basarisiz, pull --rebase deneniyor ($i/3)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            done
            echo "UYARI: push basarisiz oldu." && exit 1
          fi
