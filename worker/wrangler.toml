name = "tk-fare-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Izinli kullanici listesi burada saklanir
[[kv_namespaces]]
binding = "ACCESS"
id = "59f99aa5c20b4a178d9a1ed72b80de34"

# Guvenilir zamanlama: her 5 dakikada GitHub taramasini tetikle
[triggers]
crons = ["* * * * *"]   # her dakika: hizli tarama (GitHub 5 dk'da bir tetiklenir)

# Gizli olmayan degiskenler burada durabilir (istege bagli).
# DATA_URL varsayilani kod icinde; degistirmek istersen ac:
# [vars]
# DATA_URL = "https://raw.githubusercontent.com/emelian293/tk-fare-watch/main/latest.json"
#
# Gizli degerler koda/toml'a YAZILMAZ; komutla eklenir:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put OWNER_CHAT_ID
#   wrangler secret put WEBHOOK_SECRET
